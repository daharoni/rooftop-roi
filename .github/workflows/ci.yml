name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run engine, parser, solar and finance tests
        run: node --test
      - name: Validate tariff library
        run: node tests/validate-tariffs.mjs
